<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="t d"><title id="t">Mapa visual para comparar decisiones de IA</title><desc id="d">Dos alternativas se contrastan a través de arquitectura, seguridad, coste, evidencia y operación.</desc><rect width="1120" height="330" rx="24" fill="#f8fbff"/><g font-family="Arial,sans-serif"><text x="40" y="44" font-size="20" font-weight="700" fill="#173a5b">Comparar no es puntuar: es hacer explícitos los trade-offs</text><rect x="55" y="92" width="250" height="170" rx="20" fill="#fff" stroke="#b9d2ee"/><rect x="815" y="92" width="250" height="170" rx="20" fill="#fff" stroke="#b9d2ee"/><text x="180" y="135" text-anchor="middle" font-size="24" font-weight="800" fill="#1769df">OPCIÓN A</text><text x="940" y="135" text-anchor="middle" font-size="24" font-weight="800" fill="#1769df">OPCIÓN B</text><g font-size="12" font-weight="700" fill="#35516b" text-anchor="middle"><g><rect x="430" y="82" width="260" height="30" rx="15" fill="#fff" stroke="#d6e2ee"/><text x="560" y="102">Arquitectura</text><line x1="305" y1="97" x2="430" y2="97" stroke="#9abbe0"/><line x1="690" y1="97" x2="815" y2="97" stroke="#9abbe0"/></g><g><rect x="430" y="126" width="260" height="30" rx="15" fill="#fff" stroke="#d6e2ee"/><text x="560" y="146">Seguridad</text><line x1="305" y1="141" x2="430" y2="141" stroke="#9abbe0"/><line x1="690" y1="141" x2="815" y2="141" stroke="#9abbe0"/></g><g><rect x="430" y="170" width="260" height="30" rx="15" fill="#fff" stroke="#d6e2ee"/><text x="560" y="190">Coste total</text><line x1="305" y1="185" x2="430" y2="185" stroke="#9abbe0"/><line x1="690" y1="185" x2="815" y2="185" stroke="#9abbe0"/></g><g><rect x="430" y="214" width="260" height="30" rx="15" fill="#fff" stroke="#d6e2ee"/><text x="560" y="234">Evidencia</text><line x1="305" y1="229" x2="430" y2="229" stroke="#9abbe0"/><line x1="690" y1="229" x2="815" y2="229" stroke="#9abbe0"/></g><g><rect x="430" y="258" width="260" height="30" rx="15" fill="#fff" stroke="#d6e2ee"/><text x="560" y="278">Operación</text><line x1="305" y1="273" x2="430" y2="273" stroke="#9abbe0"/><line x1="690" y1="273" x2="815" y2="273" stroke="#9abbe0"/></g></g><text x="180" y="205" text-anchor="middle" font-size="12" fill="#63798e">Contexto · ventajas · límites</text><text x="940" y="205" text-anchor="middle" font-size="12" fill="#63798e">Contexto · ventajas · límites</text><text x="560" y="305" text-anchor="middle" font-size="11" fill="#63798e">La decisión depende del caso de uso, restricciones, riesgo y criterios de aceptación.</text></g></svg>