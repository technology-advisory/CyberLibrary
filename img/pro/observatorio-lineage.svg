<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Cadena de trazabilidad normativa</title><desc id="d">Flujo desde la fuente oficial hasta la publicación del snapshot normativo.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d7e1ec" flood-opacity="0.28"/></filter></defs><rect width="1200" height="320" rx="24" fill="#fbfdff"/><g font-family="Arial,sans-serif"><text x="58" y="42" font-size="22" font-weight="700" fill="#17324f">Cadena de trazabilidad normativa</text><text x="58" y="64" font-size="12" fill="#6c8197">Fuente oficial, snapshot controlado y publicación con validación explícita.</text><path d="M220 170H980" stroke="#d3dfe9" stroke-width="4"/><g transform="translate(62 116)" filter="url(#shadow)"><rect width="190" height="102" rx="18" fill="#fff" stroke="#8bb4ea"/><text x="20" y="28" font-size="11" font-weight="800" fill="#315e93">01 · FUENTE</text><text x="20" y="56" font-size="18" font-weight="700" fill="#17324f">EUR-Lex</text><text x="20" y="78" font-size="12" fill="#667f94">CELEX · ELI · OJ</text></g><g transform="translate(325 104)" filter="url(#shadow)"><rect width="210" height="126" rx="18" fill="#fff" stroke="#8bb4ea"/><text x="20" y="30" font-size="11" font-weight="800" fill="#315e93">02 · SNAPSHOT</text><text x="20" y="58" font-size="18" font-weight="700" fill="#17324f">Captura controlada</text><text x="20" y="82" font-size="12" fill="#667f94">fecha · alcance · hash</text><text x="20" y="100" font-size="12" fill="#667f94">artefactos · manifest</text></g><g transform="translate(608 104)" filter="url(#shadow)"><rect width="220" height="126" rx="18" fill="#fff" stroke="#72c8ba"/><text x="20" y="30" font-size="11" font-weight="800" fill="#14715e">03 · NORMALIZACIÓN</text><text x="20" y="58" font-size="18" font-weight="700" fill="#17324f">Texto estructurado</text><text x="20" y="82" font-size="12" fill="#667f94">base · cambios · índice</text><text x="20" y="100" font-size="12" fill="#667f94">lectura · búsqueda · diff</text></g><g transform="translate(900 88)" filter="url(#shadow)"><rect width="220" height="158" rx="18" fill="#fff" stroke="#b49ae9"/><text x="20" y="30" font-size="11" font-weight="800" fill="#6148a6">04 · VALIDAR / PUBLICAR</text><text x="20" y="60" font-size="16" font-weight="700" fill="#17324f">Validación estructural</text><text x="20" y="78" font-size="12" fill="#667f94">aprobada</text><text x="20" y="102" font-size="16" font-weight="700" fill="#17324f">Validación jurídica</text><text x="20" y="120" font-size="12" fill="#667f94">pendiente para consolidación</text><text x="20" y="144" font-size="12" fill="#667f94">HTML + JSON publicados</text></g><polygon points="325,170 311,162 311,178" fill="#3c70d9"/><polygon points="608,170 594,162 594,178" fill="#3c70d9"/><polygon points="900,170 886,162 886,178" fill="#3c70d9"/><path d="M535 190c45 0 55 54 145 54" fill="none" stroke="#c7d4df" stroke-width="2.5" stroke-dasharray="6 5"/><text x="555" y="264" font-size="11" fill="#7b8ea1">La consolidación automática no se publica hasta validación jurídica.</text></g></svg>