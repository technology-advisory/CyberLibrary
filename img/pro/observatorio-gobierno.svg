<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Gobierno, validación y control de cambios</title><desc id="d">Representa la separación entre captura, validación estructural, validación jurídica y estado publicable del snapshot.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d7e1ec" flood-opacity="0.28"/></filter></defs><rect width="1200" height="300" rx="24" fill="#fbfdff"/><g font-family="Arial,sans-serif"><text x="56" y="42" font-size="22" font-weight="700" fill="#17324f">Gobierno, validación y control de cambios</text><text x="56" y="64" font-size="12" fill="#6c8197">Separación explícita entre tratamiento técnico del dato y aprobación jurídica de una consolidación.</text><g transform="translate(60 110)"><circle cx="16" cy="16" r="12" fill="#3076df"/><text x="46" y="21" font-size="13" fill="#17324f">Captura desde fuente oficial</text><circle cx="16" cy="70" r="12" fill="#45a97d"/><text x="46" y="75" font-size="13" fill="#17324f">Validación estructural del artefacto</text><circle cx="16" cy="124" r="12" fill="#d89a3b"/><text x="46" y="129" font-size="13" fill="#17324f">Validación jurídica previa a consolidación</text></g><path d="M300 180h110" stroke="#b7c8d8" stroke-width="3"/><polygon points="410,180 396,173 396,187" fill="#3c70d9"/><g transform="translate(430 118)" filter="url(#shadow)"><rect width="290" height="126" rx="20" fill="#fff" stroke="#cfe0ee"/><text x="24" y="30" font-size="11" font-weight="800" fill="#315e93">ESTADO DEL SNAPSHOT</text><text x="24" y="58" font-size="17" font-weight="700" fill="#17324f">Publicable para consulta</text><text x="24" y="82" font-size="12" fill="#647d93">HTML completo · índice · cambios · comparador</text><text x="24" y="104" font-size="12" fill="#647d93">sin atribuir a CyberLibrary una consolidación</text><text x="24" y="120" font-size="12" fill="#647d93">jurídica propia</text></g><path d="M720 180h78" stroke="#b7c8d8" stroke-width="3"/><polygon points="798,180 784,173 784,187" fill="#3c70d9"/><g transform="translate(818 118)" filter="url(#shadow)"><rect width="320" height="126" rx="20" fill="#fffaf0" stroke="#e0bf7a"/><text x="24" y="30" font-size="11" font-weight="800" fill="#8b5c15">LÍMITE ACTUAL</text><text x="24" y="58" font-size="17" font-weight="700" fill="#17324f">Consolidación automática bloqueada</text><text x="24" y="82" font-size="12" fill="#647d93">La representación comparada no se eleva a texto</text><text x="24" y="98" font-size="12" fill="#647d93">consolidado hasta revisión jurídica previa.</text><text x="24" y="118" font-size="12" fill="#647d93">Se separa asistencia documental y validación legal.</text></g></g></svg>