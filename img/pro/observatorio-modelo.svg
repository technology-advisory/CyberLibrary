<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Modelo normativo actual</title><desc id="d">Entidades disponibles hoy y elementos aún no formalizados como relación o entidad canónica.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d7e1ec" flood-opacity="0.28"/></filter></defs><rect width="1200" height="340" rx="24" fill="#fbfdff"/><g font-family="Arial,sans-serif"><text x="56" y="42" font-size="22" font-weight="700" fill="#17324f">Modelo normativo actual</text><text x="56" y="64" font-size="12" fill="#6c8197">Lo que hoy existe como entidad/capa en los artefactos canónicos del snapshot.</text><path d="M255 162H945" stroke="#d4e0ea" stroke-width="4"/><g transform="translate(58 116)" filter="url(#shadow)"><rect width="210" height="94" rx="18" fill="#fff" stroke="#8bb4ea"/><text x="18" y="28" font-size="11" font-weight="800" fill="#315e93">ENTIDAD</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17324f">Documento</text><text x="18" y="76" font-size="12" fill="#5b7289">CELEX · ELI · título · fuente</text></g><g transform="translate(330 116)" filter="url(#shadow)"><rect width="220" height="94" rx="18" fill="#fff" stroke="#8bb4ea"/><text x="18" y="28" font-size="11" font-weight="800" fill="#315e93">ESTRUCTURA</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17324f">Artículo / anexo</text><text x="18" y="76" font-size="12" fill="#5b7289">capítulo · número · texto</text></g><g transform="translate(612 116)" filter="url(#shadow)"><rect width="220" height="94" rx="18" fill="#fff" stroke="#72c8ba"/><text x="18" y="28" font-size="11" font-weight="800" fill="#14715e">CAMBIO</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17324f">Operación modificadora</text><text x="18" y="76" font-size="12" fill="#5b7289">instrucción · afectación · tipo</text></g><g transform="translate(894 116)" filter="url(#shadow)"><rect width="220" height="94" rx="18" fill="#fff" stroke="#b49ae9"/><text x="18" y="28" font-size="11" font-weight="800" fill="#6148a6">VISTA</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17324f">Índice / snapshot</text><text x="18" y="76" font-size="12" fill="#5b7289">fecha · vistas · estado</text></g><g transform="translate(58 252)"><text y="0" font-size="14" font-weight="700" fill="#8b5c15">Aún no formalizado como entidad/relación canónica</text><text y="28" font-size="12" fill="#687d92">considerando independiente · referencia cruzada semántica · entrada en vigor · transposición · derogación parcial</text><text y="46" font-size="12" fill="#687d92">firma de aprobación · sellado temporal</text><text y="70" font-size="11" fill="#8898a9">La ausencia se declara para no confundir lectura y comparación con un modelado jurídico completo.</text></g></g></svg>