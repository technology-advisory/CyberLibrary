<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-labelledby="t d"><title id="t">Histórico y auditabilidad</title><desc id="d">Relación entre snapshot activo, predecesor no definido y ausencia de serie histórica longitudinal declarada.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d7e1ec" flood-opacity="0.28"/></filter></defs><rect width="1200" height="290" rx="24" fill="#fbfdff"/><g font-family="Arial,sans-serif"><text x="54" y="40" font-size="22" font-weight="700" fill="#17324f">Histórico y auditabilidad</text><text x="54" y="62" font-size="12" fill="#6c8197">El snapshot activo es identificable; la serie longitudinal completa y las garantías probatorias adicionales no se declaran aún.</text><path d="M120 160H1045" stroke="#d4e0ea" stroke-width="4"/><g transform="translate(140 116)" filter="url(#shadow)"><circle cx="32" cy="32" r="26" fill="#3076df"/><text x="92" y="18" font-size="11" font-weight="800" fill="#315e93">SNAPSHOT ACTIVO</text><text x="92" y="42" font-size="16" font-weight="700" fill="#17324f">Identificado</text><text x="92" y="62" font-size="12" fill="#687d92">hash · manifiesto · fecha</text></g><g transform="translate(465 116)" filter="url(#shadow)"><circle cx="32" cy="32" r="22" fill="#dbe5ee"/><text x="88" y="18" font-size="11" font-weight="800" fill="#7c8da0">PREDECESOR</text><text x="88" y="42" font-size="16" font-weight="700" fill="#17324f">No definido</text><text x="88" y="62" font-size="12" fill="#687d92">sin cadena temporal publicada</text></g><g transform="translate(790 116)" filter="url(#shadow)"><circle cx="32" cy="32" r="22" fill="#dbe5ee"/><text x="88" y="18" font-size="11" font-weight="800" fill="#7c8da0">SERIE HISTÓRICA</text><text x="88" y="42" font-size="16" font-weight="700" fill="#17324f">No declarada como completa</text><text x="88" y="62" font-size="12" fill="#687d92">no debe inferirse reconstrucción integral</text></g><g transform="translate(840 224)" filter="url(#shadow)"><rect width="300" height="40" rx="10" fill="#fffaf0" stroke="#e1c17c"/><text x="150" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#8b5c15">firma · timestamp · WORM · rollback normativo: no definido</text></g></g></svg>