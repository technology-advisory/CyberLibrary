<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">Rutas de aprendizaje de CyberLibrary AI</title>
<desc id="desc">Seis recorridos profesionales conectan un rol de entrada con cuatro pasos de aprendizaje y CyberLibrary AI.</desc>
<defs>
