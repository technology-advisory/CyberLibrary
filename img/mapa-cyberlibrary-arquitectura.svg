 <rect x="214" y="452" width="170" height="70" rx="6" class="node2"/><text x="228" y="474" class="m tiny">09</text><text x="228" y="503" class="t small">Observabilidad de IA</text>
 <rect x="410" y="452" width="170" height="70" rx="6" class="node2"/><text x="424" y="474" class="m tiny">10</text><text x="424" y="496" class="t small">Seguridad Cloud</text><text x="424" y="512" class="t small">para IA</text>
