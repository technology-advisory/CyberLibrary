 <rect x="802" y="452" width="170" height="70" rx="6" class="node2"/><text x="816" y="474" class="m tiny">12</text><text x="816" y="496" class="t small">Gobierno del dato</text><text x="816" y="512" class="t small">para IA</text>
 <rect x="998" y="452" width="198" height="70" rx="6" class="node2"/><text x="1012" y="474" class="m tiny">13</text><text x="1012" y="503" class="t small">Automatización y controles</text>
</g>
