<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de contenidos de CyberLibrary AI</title>
<desc id="desc">Mapa visual que conecta los accesos principales con el núcleo CyberLibrary AI, sus trece pilares de conocimiento y los recursos transversales.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17314f" flood-opacity=".09"/></filter>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#1a2e43}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#74869a}.line{fill:none;stroke:#b7c6d6;stroke-width:2}.dash{fill:none;stroke:#c7d3df;stroke-width:1.5;stroke-dasharray:5 7}.node{fill:#fff;stroke:#cad6e2;stroke-width:1.4}.node2{fill:#f9fbfd;stroke:#cad6e2;stroke-width:1.4}.blue{fill:#edf5ff;stroke:#1f6fe0;stroke-width:1.6}.purple{fill:#f4f0ff;stroke:#7b61d9;stroke-width:1.6}.green{fill:#edf8f4;stroke:#178267;stroke-width:1.6}.dark{fill:#17314f}.title{font-size:17px;font-weight:750}.small{font-size:11px;font-weight:650}.tiny{font-size:9px;font-weight:700;letter-spacing:.08em}.white{fill:#fff}.muted{fill:#6d7f92}.accent{fill:#1f6fe0}
  </style>
</defs>
<rect width="1440" height="790" fill="#f8fafc"/>
<g opacity=".5"><path class="dash" d="M40 126H1400M40 270H1400M40 648H1400"/></g>
<text x="48" y="54" class="m tiny">CAPA 01 · ACCESO</text>
<text x="48" y="207" class="m tiny">CAPA 02 · NÚCLEO DE CONOCIMIENTO</text>
<text x="48" y="598" class="m tiny">CAPA 03 · RECURSOS TRANSVERSALES</text>

<!-- Access -->
<g filter="url(#shadow)">
 <rect x="168" y="78" width="230" height="72" rx="8" class="blue"/><text x="188" y="105" class="m tiny accent">CONOCIMIENTO</text><text x="188" y="130" class="t title">Biblioteca · 13 pilares</text>
 <rect x="432" y="78" width="180" height="72" rx="8" class="node"/><text x="452" y="105" class="m tiny">ORIENTACIÓN</text><text x="452" y="130" class="t title">Rutas</text>
 <rect x="646" y="78" width="194" height="72" rx="8" class="purple"/><text x="666" y="105" class="m tiny">EJECUCIÓN</text><text x="666" y="130" class="t title">CyberSkills</text>
 <rect x="874" y="78" width="180" height="72" rx="8" class="node"/><text x="894" y="105" class="m tiny">ACCESO DIRECTO</text><text x="894" y="130" class="t title">Buscar</text>
</g>
<path class="line" d="M283 150V178H718V214M522 150V178M743 150V214M964 150V178H718"/>

<!-- Core -->
<g filter="url(#shadow)"><rect x="570" y="218" width="296" height="88" rx="12" class="dark"/><text x="718" y="250" text-anchor="middle" class="m tiny white">ÍNDICE MAESTRO</text><text x="718" y="278" text-anchor="middle" class="t title white" style="font-size:22px">CyberLibrary AI</text><text x="718" y="296" text-anchor="middle" class="t small white" opacity=".72">Conocimiento · ejecución · evidencia</text></g>
<path class="line" d="M718 306V332M118 332H1318M118 332V354M318 332V354M518 332V354M718 332V354M918 332V354M1118 332V354M1318 332V354"/>

